<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0208" />
    <!-- Kill any legacy service worker + its caches. The old PWA production site
         registered a service worker on this domain that serves stale assets
         offline-first, so returning visitors saw old environments/animations until
         a hard refresh. This unregisters it and clears the caches on every load,
         so the current build always loads without needing to refresh. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <title>TRULYS WORLD</title>
    <meta
      name="description"
      content="Her world is a map. An interactive Los Angeles where every neighborhood is a case file. Truly Young — Dear Joshua."
    />
    <meta property="og:title" content="TRULYS WORLD" />
    <meta
      property="og:description"
      content="Her world is a map. An interactive Los Angeles where every neighborhood is a case file."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
